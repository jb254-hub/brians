<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />

  <title>Exegesis</title>

  <meta name="description" content="Exegesis AI chat assistant" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
  />
  <link rel="stylesheet" href="styles.css">



</head>

<body>

<div class="app" id="app">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-inner">

      <div class="brand">

        <div class="brand-mark">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#07110d"
            stroke-width="2.2"
          >
            <path d="M12 2a7 7 0 0 0-7 7c0 3 2 4.5 2 7a5 5 0 0 0 10 0c0-2.5 2-4 2-7a7 7 0 0 0-7-7z"/>
          </svg>

        </div>

        <div>
          <div class="brand-name">Exegesis</div>
          <div class="brand-sub">AI assistant · Version 1</div>
        </div>

      </div>

      <button class="new-chat" id="newChatBtn">
        <span>＋</span>
        New chat
      </button>

      <div class="search">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="7"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>

        <input
          id="searchInput"
          placeholder="Search chats"
        />

      </div>

      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-footer">

        <button class="side-btn" id="settingsSideBtn">
          <span>⚙</span>
          
        </button>

        <button class="side-btn" id="clearBtn">
          <span>⌫</span>
          Clear history
        </button>

        <div
          class="side-btn"
          style="cursor:default"
        >
          <span>🔒</span>
          Chats stored locally
          <span class="side-note">browser</span>
        </div>

      </div>

    </div>

  </aside>

  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">

    <div class="topbar">

      <button
        class="icon-btn"
        id="menuBtn"
        title="Toggle sidebar"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <div class="top-title">
        Exegesis
        <span id="topbarChatName"></span>
      </div>

      <div class="status" id="apiStatus">

        <span class="status-dot"></span>

        <span id="apiStatusText">
          Configure API
        </span>

      </div>

      <button
        class="icon-btn settings-btn"
        id="settingsBtn"
        title="API settings"
      >
    
      </button>

    </div>

    <div class="stream" id="stream">

      <div
        class="stream-inner"
        id="streamInner"
      ></div>

    </div>

    <button
      class="scroll-bottom"
      id="scrollBottomBtn"
      title="Scroll to bottom"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="m6 9 6 6 6-6"/>
      </svg>

    </button>

    <!-- =========================
         COMPOSER
    ========================== -->

    <div class="composer-shell">

      <div class="composer-card">

        <div class="composer">

          <textarea
            id="input"
            rows="1"
            placeholder="Message Exegesis…"
            autocomplete="off"
            spellcheck="true"
          ></textarea>

          <button
            class="circle-btn mic"
            id="micBtn"
            title="Voice input"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
            </svg>

          </button>

          <button
            class="circle-btn send"
            id="sendBtn"
            disabled
            title="Send"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
            >
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>

          </button>

        </div>

        <div class="composer-foot">
          Exegesis got you covered
        </div>

      </div>

    </div>

  </main>

</div>

<!-- =========================
     TOAST
========================= -->

<div
  class="toast"
  id="toast"
></div>

<!-- =========================
     API SETTINGS MODAL
========================= -->

<div
  class="modal-backdrop"
  id="settingsModal"
>

  <div class="modal">

    <div class="modal-head">

      <h2>
        Exegesis API settings
      </h2>

      <button
        class="close-modal"
        id="closeSettings"
      >
        ×
      </button>

    </div>

    <div class="warning">

      This the current model you are using.Kindly dont change anything here

    </div>

    <div class="field">

      <input
        id="apiEndpoint"
        placeholder="https://provider.example/v1/chat/completions"
      >

      <small>
      </small>

    </div>

    <div class="field">

      <input
        id="apiKey"
        type="password"
        autocomplete="off"
        placeholder="Your API key"
      >

    </div>

    <div class="field">

      <input
        id="apiModel"
        placeholder="Model ID required by your provider"
      >

    </div>

    <div class="modal-actions">

      <button
        class="btn"
        id="testApiBtn"
      >
        Test connection
      </button>

      <button
        class="btn primary"
        id="saveSettingsBtn"
      >
        Save settings
      </button>

    </div>

  </div>

</div>

 <script src="script.js"></script>

</body>
</html>
